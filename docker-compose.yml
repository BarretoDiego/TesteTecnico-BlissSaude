name: saude-bliss

services:
  # ---------------------------------------------------------------------------
  # LocalStack Pro — emula API Gateway, Lambda, RDS, Secrets Manager, IAM e logs.
  # RDS é feature Pro, por isso a imagem `-pro` e o LOCALSTACK_AUTH_TOKEN.
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack-pro:latest
    container_name: saude-bliss-localstack
    ports:
      # Gateway único. Porta configurável para não colidir com outra instância
      # de LocalStack já rodando na máquina (o padrão 4566 costuma estar ocupado).
      - "${LOCALSTACK_PORT:-4568}:4566"
      # Faixa de portas de serviços externos (o RDS emulado escuta aqui).
      - "4510-4530:4510-4530"
    environment:
      # Vazio aqui de propósito: `docker compose` interpola o arquivo inteiro,
      # então um `:?` obrigatório impediria até `up postgres`. Quem cobra o token
      # é scripts/localstack/wait-ready.sh, que valida a licença de fato ativa.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: apigateway,lambda,rds,secretsmanager,iam,logs,cloudwatch,sts,s3
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      # As Lambdas rodam em containers próprios; anexá-las a esta rede é o que
      # permite resolver `postgres` e o endpoint do RDS por nome.
      LAMBDA_DOCKER_NETWORK: saude-bliss_default
      LAMBDA_REMOVE_CONTAINERS: 1
      # Sem persistência o banco emulado esvazia a cada restart do container.
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
      # Necessário para o LocalStack subir os containers de Lambda.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Postgres direto — serve a dois propósitos:
  #   1. loop de desenvolvimento da API sem depender do LocalStack (fase 1);
  #   2. fallback do RDS emulado via `use_localstack_rds = false` no Terraform.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: saude-bliss-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saudebliss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saudebliss}
      POSTGRES_DB: ${POSTGRES_DB:-saudebliss}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saudebliss} -d ${POSTGRES_DB:-saudebliss}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  localstack-data:
  postgres-data:
