name: saude-bliss

services:
  # ---------------------------------------------------------------------------
  # LocalStack — emula API Gateway, Lambda, IAM, Secrets Manager e CloudWatch.
  #
  # Fixado na **v3** de propósito: a partir de 2026 as imagens `latest` exigem
  # LOCALSTACK_AUTH_TOKEN mesmo para os serviços gratuitos, e o container aborta
  # na inicialização sem ele. A v3 é a última que roda sem licença, e cobre tudo
  # o que este projeto usa — API Gateway, Lambda, IAM, Secrets Manager, logs.
  #
  # O único recurso que fica de fora é a emulação de RDS, que sempre foi Pro. O
  # Terraform já vem com `create_rds_instance = false`, apontando o segredo para
  # o Postgres deste mesmo compose: o deploy roda ponta a ponta sem licença.
  #
  # Com um token válido, use `LOCALSTACK_IMAGE=localstack/localstack-pro:latest`,
  # acrescente `rds` em LOCALSTACK_SERVICES e ligue `create_rds_instance = true`
  # em `infra/terraform/environments/local.tfvars`.
  # ---------------------------------------------------------------------------
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:3}
    container_name: saude-bliss-localstack
    ports:
      # Gateway único. Porta configurável para não colidir com outra instância
      # de LocalStack já rodando na máquina (o padrão 4566 costuma estar ocupado).
      - "${LOCALSTACK_PORT:-4568}:4566"
      # Faixa de portas de serviços externos (o RDS emulado escuta aqui).
      - "4510-4530:4510-4530"
    environment:
      # Vazio aqui de propósito: `docker compose` interpola o arquivo inteiro,
      # então um `:?` obrigatório impediria até `up postgres`. Quem cobra o token
      # é scripts/localstack/wait-ready.sh, que valida a licença de fato ativa.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # `rds` fora da lista de propósito: pedir um serviço Pro faz o container
      # abortar com "License activation failed" mesmo na imagem Community.
      # Acrescente `rds` aqui junto com a imagem `-pro` e o token para exercitar
      # o RDS emulado.
      #
      # `cloudformation` entra pela trilha do Serverless Framework: `sls deploy`
      # sobe um stack, e sem o serviço habilitado o deploy morre logo na primeira
      # chamada. É Community, ao contrário do `rds` — não exige licença.
      SERVICES: ${LOCALSTACK_SERVICES:-apigateway,lambda,secretsmanager,iam,logs,cloudwatch,sts,s3,events,sqs,cloudformation}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      # As Lambdas rodam em containers próprios; anexá-las a esta rede é o que
      # permite resolver `postgres` e o endpoint do RDS por nome.
      LAMBDA_DOCKER_NETWORK: saude-bliss_default
      LAMBDA_REMOVE_CONTAINERS: 1
      # Sem persistência o banco emulado esvazia a cada restart do container.
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
      # Necessário para o LocalStack subir os containers de Lambda.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Postgres direto — serve a dois propósitos:
  #   1. loop de desenvolvimento da API sem depender do LocalStack (fase 1);
  #   2. fallback do RDS emulado via `use_localstack_rds = false` no Terraform.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: saude-bliss-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saudebliss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saudebliss}
      POSTGRES_DB: ${POSTGRES_DB:-saudebliss}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saudebliss} -d ${POSTGRES_DB:-saudebliss}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  localstack-data:
  postgres-data:
